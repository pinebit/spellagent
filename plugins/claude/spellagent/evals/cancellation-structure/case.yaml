schema_version: "1.1"
name: cancellation-structure
description: >
  This case cannot script a mid-run SIGINT inside claude plugin eval's own
  runner, so it only asserts that a normal completed run over a large-enough
  scope (10 files) follows the required Result/What changed/Needs
  attention/Coverage section structure in order; true interrupted-run
  evidence is covered separately by a live SIGINT test outside this eval
  suite (docs/phase-d.md's "Live cancellation test" section), not by this case.
tags: [ux, section2]
context:
  add_dirs: [sample]
execution:
  prompt: |
    /spellagent:check check sample
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Task, Bash, Edit, Write]
runs: 3
expected_outcome: >
  The final response follows the Result, What changed, Needs attention, and
  Coverage structure in that order for a normal completed run across all 10
  files.
