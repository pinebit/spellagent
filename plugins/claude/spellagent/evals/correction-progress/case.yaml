schema_version: "1.1"
name: correction-progress
description: >
  A multi-file Correct run must show incremental per-file progress as each
  file completes, not stay silent until the final summary.
tags: [ux, section2]
context:
  add_dirs: [sample]
execution:
  prompt: |
    /spellagent:check check sample
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Task, Bash, Edit, Write]
runs: 3
expected_outcome: >
  The transcript shows incremental per-file progress (for example, "Reviewed N
  of 6 files") before the final summary is produced, rather than a single
  silent run followed only by a final report.
